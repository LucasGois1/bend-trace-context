name: External documentation links

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: external links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --scheme https --scheme http --max-retries 3 --timeout 30 '*.md' 'packages/**/*.md'
          output: build/quality/external-links.md
          fail: true
      - name: Preserve external link report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-links-${{ github.sha }}
          path: build/quality/external-links.md
          if-no-files-found: error
          retention-days: 14
